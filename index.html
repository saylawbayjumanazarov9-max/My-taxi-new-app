<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Taxi - VIP</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #800020;
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
        }
        .container {
            flex: 1;
            padding: 15px;
            display: flex;
            flex-direction: column;
            gap: 12px;
            overflow-y: auto;
        }
        .card {
            background: #fff;
            padding: 15px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group label {
            display: block;
            font-size: 12px;
            color: #666;
            margin-bottom: 4px;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #800020;
        }
        .tariffs {
            display: flex;
            gap: 10px;
        }
        .tariff-btn {
            flex: 1;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 8px;
            background: #fff;
            text-align: center;
            cursor: pointer;
        }
        .tariff-btn.active {
            border-color: #800020;
            background: #fdf2f4;
            color: #800020;
            font-weight: bold;
        }
        .btn {
            width: 100%;
            background-color: #800020;
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        /* Modal */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
        }
        .modal-content {
            background: white;
            padding: 20px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 300px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #800020;
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>🚗 My Taxi VIP</header>

    <div class="container">
        <div class="card">
            <div class="input-group">
                <label>Qayerdan (Ketish nuqtasi)</label>
                <input type="text" id="pickup" value="Nukus shahri" placeholder="Manzilni kiriting">
            </div>
            <div class="input-group">
                <label>Qayerga (Borish manzili)</label>
                <input type="text" id="destination" placeholder="Masalan: Bozor, Universitet">
            </div>
        </div>

        <div class="card">
            <label style="font-size: 12px; color: #666; margin-bottom: 6px; display: block;">Tarifni tanlang:</label>
            <div class="tariffs">
                <div class="tariff-btn active" onclick="selectTariff('Ekonom', 10000, this)">
                    <div>Ekonom</div>
                    <div style="font-size: 12px; color: #555;">10,000 so'm</div>
                </div>
                <div class="tariff-btn" onclick="selectTariff('Komfort', 18000, this)">
                    <div>Komfort</div>
                    <div style="font-size: 12px; color: #555;">18,000 so'm</div>
                </div>
            </div>
        </div>

        <button class="btn" onclick="orderTaxi()">Mashina chaqirish</button>
    </div>

    <!-- Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: #800020; margin-bottom: 5px;">Haydovchi qidirilmoqda...</h3>
            <div class="spinner" id="modalSpinner"></div>
            <p id="modalText" style="font-size: 13px; color: #666; margin-top: 5px;">Kuting...</p>
            <button class="btn" onclick="closeModal()" style="margin-top: 10px; background: #ddd; color: #333; padding: 10px;">Bekor qilish</button>
        </div>
    </div>

    <script>
        let selectedTariff = "Ekonom";
        let selectedPrice = 10000;

        function selectTariff(name, price, element) {
            selectedTariff = name;
            selectedPrice = price;
            document.querySelectorAll('.tariff-btn').forEach(btn => btn.classList.remove('active'));
            element.classList.add('active');
        }

        function orderTaxi() {
            let destination = document.getElementById('destination').value;
            if(!destination) {
                alert("Iltimos, borish manzilingizni kiriting!");
                return;
            }

            document.getElementById('searchModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = "Haydovchi qidirilmoqda...";
            document.getElementById('modalSpinner').style.display = 'block';
            document.getElementById('modalText').innerText = "Tarif: " + selectedTariff + " (" + selectedPrice.toLocaleString() + " so'm)\nKuting...";

            setTimeout(function() {
                document.getElementById('modalSpinner').style.display = 'none';
                document.getElementById('modalTitle').innerText = "Haydovchi topildi! 🎉";
                document.getElementById('modalText').innerHTML = "<b>Haydovchi:</b> Anvar aka<br><b>Mashina:</b> Gentra (Oq)<br><br>⏳ <b>3 daqiqada yetib keladi.</b>";
            }, 3000);
        }

        function closeModal() {
            document.getElementById('searchModal').style.display = 'none';
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Taksi</title>
    <!-- Leaflet Xarita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f5f5f5;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        /* Xarita */
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        /* Pastki boshqaruv paneli */
        .panel {
            background: #ffffff;
            padding: 20px 15px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .input-box {
            background: #f0f0f0;
            border-radius: 12px;
            padding: 12px 15px;
            margin-bottom: 10px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }
        .input-box input {
            border: none;
            background: transparent;
            font-size: 16px;
            width: 100%;
            outline: none;
            color: #333;
        }
        /* Kategoriya menyusi (Navigator, Taksi, va h.k.) */
        .categories {
            display: flex;
            gap: 15px;
            overflow-x: auto;
            padding-bottom: 10px;
            margin-bottom: 12px;
            scrollbar-width: none;
        }
        .categories::-webkit-scrollbar {
            display: none;
        }
        .cat-item {
            font-size: 14px;
            color: #777;
            cursor: pointer;
            white-space: nowrap;
            padding-bottom: 4px;
        }
        .cat-item.active {
            color: #000;
            font-weight: bold;
            border-bottom: 2px solid #ffcc00;
        }
        /* Tariflar */
        .tariffs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tariff-card {
            flex: 1;
            background: #f7f7f7;
            border: 2px solid transparent;
            padding: 12px;
            border-radius: 12px;
            cursor: pointer;
            transition: 0.2s;
        }
        .tariff-card.active {
            border-color: #ffcc00;
            background: #fffdf0;
        }
        .tariff-card h4 {
            font-size: 15px;
            margin-bottom: 4px;
            color: #000;
        }
        .tariff-card p {
            font-size: 12px;
            color: #666;
        }
        /* Pastki tugma paneli */
        .bottom-actions {
            display: flex;
            align-items: center;
            gap: 10px;
        }
        .btn-order {
            flex: 1;
            background-color: #ffcc00;
            color: #000;
            padding: 16px;
            border: none;
            border-radius: 14px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            text-align: center;
        }
        .btn-order:active {
            background-color: #e6b800;
        }
        .icon-btn {
            background: #f0f0f0;
            border: none;
            width: 52px;
            height: 52px;
            border-radius: 14px;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: pointer;
            font-size: 20px;
        }

        .modal {
            display: none;
            position: fixed;

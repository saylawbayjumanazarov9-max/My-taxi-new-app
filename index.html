<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Taxi - Ultimate Pro Max</title>
    <!-- Leaflet Xarita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        :root {
            --bg-color: #f4f4f4;
            --card-bg: #ffffff;
            --text-color: #333333;
            --primary-color: #800020;
            --border-color: #ddd;
            --input-bg: #fafafa;
        }
        [data-theme="dark"] {
            --bg-color: #121212;
            --card-bg: #1e1e1e;
            --text-color: #f1f1f1;
            --primary-color: #a30029;
            --border-color: #333;
            --input-bg: #2a2a2a;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
            transition: background 0.3s, color 0.3s;
        }
        header {
            background-color: var(--primary-color);
            color: #fff;
            padding: 12px 14px;
            text-align: center;
            font-size: 17px;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .header-controls {
            display: flex;
            gap: 6px;
        }
        .control-btn {
            background: rgba(255,255,255,0.2);
            border: none;
            color: #fff;
            padding: 5px 8px;
            border-radius: 6px;
            cursor: pointer;
            font-size: 12px;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            padding-bottom: 80px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: var(--card-bg);
            padding: 12px;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.05);
            margin-bottom: 10px;
            border: 1px solid var(--border-color);
        }
        #map {
            width: 100%;
            height: 150px;
            border-radius: 8px;
            margin-bottom: 8px;
            z-index: 1;
        }
        .saved-places {
            display: flex;
            gap: 6px;
            overflow-x: auto;
            margin-bottom: 8px;
            padding-bottom: 4px;
        }
        .place-chip {
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            padding: 5px 10px;
            border-radius: 15px;
            font-size: 11px;
            color: var(--primary-color);
            font-weight: 600;
            cursor: pointer;
            white-space: nowrap;
        }
        .input-group {
            margin-bottom: 8px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #888;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .input-with-icon {
            display: flex;
            gap: 6px;
        }
        .input-group input, .input-group select {
            width: 100%;
            padding: 9px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            font-size: 13px;
            outline: none;
            background: var(--input-bg);
            color: var(--text-color);
        }
        .mic-btn {
            background: var(--primary-color);
            color: #fff;
            border: none;
            padding: 0 12px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .tariffs {
            display: flex;
            gap: 6px;
        }
        .tariff-btn {
            flex: 1;
            padding: 8px 4px;
            border: 2px solid var(--border-color);
            border-radius: 8px;
            background: var(--card-bg);
            text-align: center;
            cursor: pointer;
            color: var(--text-color);
        }
        .tariff-btn.active {
            border-color: var(--primary-color);
            background-color: rgba(128, 0, 32, 0.08);
            color: var(--primary-color);
            font-weight: bold;
        }
        .payment-methods {
            display: flex;
            gap: 6px;
        }
        .pay-btn {
            flex: 1;
            padding: 8px 4px;
            border: 1px solid var(--border-color);
            border-radius: 8px;
            background: var(--input-bg);
            text-align: center;
            font-size: 11px;
            cursor: pointer;
            color: var(--text-color);
        }
        .pay-btn.active {
            border-color: var(--primary-color);
            background-color: rgba(128, 0, 32, 0.08);
            color: var(--primary-color);
            font-weight: bold;
        }
        .btn {
            width: 100%;
            background-color: var(--primary-color);
            color: #fff;
            padding: 13px;
            border: none;
            border-radius: 10px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 6px;
            box-shadow: 0 4px 10px rgba(128, 0, 32, 0.2);
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 60px;
            background: var(--card-bg);
            display: flex;
            border-top: 1px solid var(--border-color);
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #888;
            cursor: pointer;
        }
        .nav-item.active {
            color: var(--primary-color);
            font-weight: bold;
        }
        .nav-item span {
            font-size: 16px;
            margin-bottom: 2px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }
        .modal-content {
            background: var(--card-bg);
            color: var(--text-color);
            padding: 20px;
            border-radius: 14px;
            text-align: center;
            width: 100%;
            max-width: 320px;
            border: 1px solid var(--border-color);
            max-height: 90vh;
            overflow-y: auto;
        }
        .spinner {
            border: 4px solid var(--border-color);
            border-top: 4px solid var(--primary-color);
            border-radius: 50%;
            width: 35px;
            height: 35px;
            animation: spin 1s linear infinite;
            margin: 10px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        .history-item, .fav-item {
            background: var(--input-bg);
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 8px;
            border-left: 4px solid var(--primary-color);
            font-size: 12px;
            text-align: left;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .stars {
            font-size: 24px;
            color: #ccc;
            cursor: pointer;
            margin: 8px 0;
        }
        .stars span.rated {
            color: #ffc107;
        }
        .chat-box {
            background: var(--input-bg);
            border-radius: 8px;
            padding: 8px;
            margin: 8px 0;
            font-size: 12px;
            text-align: left;
            max-height: 80px;
            overflow-y: auto;
        }
        .chat-btn-group {
            display: flex;
            gap: 4px;
            margin-top: 5px;
        }
        .chat-quick-btn {
            flex: 1;
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            font-size: 10px;
            padding: 5px;
            border-radius: 6px;
            cursor: pointer;
            color: var(--primary-color);
        }
    </style>
</head>

        <span id="headerTitle">🚗 My Taxi VIP</span>
        <div class="header-controls">
            <select id="langSelect" onchange="changeLanguage()" style="background: rgba(255,255,255,0.2); color: #fff; border: none; padding: 4px; border-radius: 6px; font-size: 11px;">

                <option value="qq" style="color: #333;">Qaraqalpaq</option>

            </select>
            <button class="control-btn" onclick="toggleTheme()">🌙</button>

                    </div>

            </div>

            <div class="card">

                    </div>
                    <div class="tariff-btn" onclick="selectTariff('Komfort', 18000, this)">
                        <div style="font-size: 12px;">Komfort</div>
                        <div style="font-size: 10px; color: #888;">18 ming</div>
                    </div>
                    <div class="tariff-btn" onclick="selectTariff('Biznes', 30000, this)">
                        <div style="font-size: 12px;">Biznes</div>
                        <div style="font-size: 10px; color: #888;">30 ming</div>
                    </div>
                </div>
            </div>

            <div class="card">
                <label id="lblPay" style="font-size: 11px; color: #888; margin-bottom: 6px; display: block; font-weight: bold;">To'lov turi:</label>
                <div class="payment-methods">
                    <div class="pay-btn active" onclick="selectPayment('Naqd pul', this)">💵 Naqd</div>
                    <div class="pay-btn" onclick="selectPayment('Karta', this)">💳 Karta</div>
                    <div class="pay-btn" onclick="selectPayment('Bonus', this)">🎁 Bonus</div>
                </div>
            </div>

            <!-- ASOSIY BUYURTMA BERISH TUGMASI -->
            <button class="btn" id="btnOrder" onclick="orderTaxi()">🚗 Mashina chaqirish</button>
        </div>

        <!-- 2. TARIX -->
        <div id="tab-history" class="tab-content">
            <div class="card">
                <h3 id="histTitle" style="color: var(--primary-color); font-size: 15px; margin-bottom: 10px;">Buyurtmalar tarixi</h3>
                <div id="historyList">
                    <p style="font-size: 12px; color: #888;">Hozircha buyurtmalar yo'q.</p>
                </div>
            </div>
        </div>

        <!-- 3. PROFIL VA BALANS -->
        <div id="tab-profile" class="tab-content">

                <p style="font-size: 11px; color: #888;">+998 90 123 45 67</p>

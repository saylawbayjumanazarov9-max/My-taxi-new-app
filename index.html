<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Taxi - Light Pro</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f4;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #800020;
            color: #fff;
            padding: 12px;
            text-align: center;
            font-size: 16px;
            font-weight: bold;
        }
        .content {
            flex: 1;
            overflow-y: auto;
            padding: 10px;
            padding-bottom: 70px;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        .card {
            background: #fff;
            padding: 12px;
            border-radius: 10px;
            box-shadow: 0 1px 4px rgba(0,0,0,0.05);
            margin-bottom: 10px;
        }
        .input-group {
            margin-bottom: 8px;
        }
        .input-group label {
            display: block;
            font-size: 11px;
            color: #666;
            margin-bottom: 3px;
            font-weight: bold;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 6px;
            font-size: 14px;
            outline: none;
            background: #fff;
            color: #333;
        }
        .tariffs {
            display: flex;
            gap: 6px;
        }
        .tariff-btn {
            flex: 1;
            padding: 8px;
            border: 2px solid #ccc;
            border-radius: 6px;
            background: #fff;
            text-align: center;
            cursor: pointer;
            font-size: 12px;
        }
        .tariff-btn.active {
            border-color: #800020;
            background: #fdf2f4;
            color: #800020;
            font-weight: bold;
        }
        .payment-methods {
            display: flex;
            gap: 6px;
        }
        .pay-btn {
            flex: 1;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 6px;
            background: #f9f9f9;
            text-align: center;
            font-size: 12px;
            cursor: pointer;
        }
        .pay-btn.active {
            border-color: #800020;
            background: #fdf2f4;
            color: #800020;
            font-weight: bold;
        }
        .btn {
            width: 100%;
            background-color: #800020;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 55px;
            background: #fff;
            display: flex;
            border-top: 1px solid #ddd;
            z-index: 1000;
        }
        .nav-item {
            flex: 1;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-size: 11px;
            color: #777;
            cursor: pointer;
        }
        .nav-item.active {
            color: #800020;
            font-weight: bold;
        }
        .nav-item span {
            font-size: 15px;
            margin-bottom: 1px;
        }
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }
        .modal-content {
            background: #fff;
            color: #333;
            padding: 20px;
            border-radius: 10px;
            text-align: center;
            width: 100%;
            max-width: 300px;
        }
        .history-item {
            background: #f9f9f9;
            padding: 8px;
            border-radius: 6px;
            margin-bottom: 6px;
            border-left: 3px solid #800020;
            font-size: 12px;
        }
    </style>
</head>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Taxi - VIP</title>
    <!-- Leaflet Xarita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        body {
            background-color: #f8f9fa;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #800020; /* Bardoviy rang */
            color: #fff;
            padding: 16px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            z-index: 1000;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        .panel {
            background: #ffffff;
            padding: 20px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -6px 20px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        .input-group {
            margin-bottom: 12px;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 12px;
            color: #666;
            font-weight: 600;
        }
        .input-group input {
            width: 100%;
            padding: 12px 14px;
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            font-size: 15px;
            outline: none;
            background: #fdfdfd;
            transition: border 0.2s;
        }
        .input-group input:focus {
            border-color: #800020;
            background: #fff;
        }
        .search-hint {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }
        .tariffs {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }
        .tariff-card {
            flex: 1;
            border: 2px solid #e0e0e0;
            padding: 12px;
            border-radius: 12px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }
        .tariff-card.active {
            border-color: #800020;
            background-color: #fdf2f4;
        }
        .tariff-card h4 {
            font-size: 15px;
            margin-bottom: 4px;
            color: #800020;
        }
        .tariff-card p {
            font-size: 12px;
            color: #555;
            font-weight: bold;
        }
        .btn {
            width: 100%;
            background-color: #800020;
            color: #fff;
            padding: 16px;
            border: none;
            border-radius: 12px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s, transform 0.1s;
        }
        .btn:active {
            background-color: #5c0015;
            transform: scale(0.98);
        }
        /* Modal oyna */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.6);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 20px;
            text-align: center;
            width: 100%;
            max-width: 330px;
            box-shadow: 0 10px 25px rgba(0,0,0,0.2);
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #800020;
            border-radius: 50%;
            width: 45px;
            height: 45px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>🚗 My Taxi VIP</header>

    <!-- Xarita -->
    <div id="map"></div>

    <!-- Boshqaruv Paneli -->
    <div class="panel">
        <div class="input-group">
            <label>Qayerdan (Ketish nuqtasi)</label>
            <input type="text" id="pickup" placeholder="Masalan: Berdaq ko'chasi..." onchange="searchLocation('pickup')">
            <div class="search-hint">Manzilni yozib, boshqa joyga bosing</div>
        </div>
        <div class="input-group">
            <label>Qayerga (Borish manzili)</label>
            <input type="text" id="destination" placeholder="Masalan: Bozor, Universitet..." onchange="searchLocation('destination')">
            <div class="search-hint">Manzilni yozib, boshqa joyga bosing</div>
        </div>

        <label style="font-size: 13px; color: #555; margin-bottom: 6px; display: block; font-weight: 600;">Tarifni tanlang:</label>
        <div class="tariffs">
            <div class="tariff-card active" onclick="selectTariff('Ekonom', 10000)">
                <h4>Ekonom</h4>
                <p>10,000 so'm</p>
            </div>
            <div class="tariff-card" onclick="selectTariff('Komfort', 18000)">
                <h4>Komfort</h4>
                <p>18,000 so'm</p>
            </div>
        </div>

        <button class="btn" onclick="orderTaxi()">Mashina chaqirish</button>
    </div>

    <!-- Haydovchi qidirish Modal Oynasi -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: #800020; margin-bottom: 5px;">Haydovchi qidirilmoqda...</h3>
            <div class="spinner" id="modalSpinner"></div>
            <p id="modalText" style="font-size: 14px; color: #666; margin-top: 10px; line-height: 1.4;">Atrofdagi bo'sh haydovchilarga so'rov yuborilmoqda.</p>
            <button class="btn" id="cancelBtn" onclick="closeModal()" style="margin-top: 18px; background: #eee; color: #333; padding: 12px; font-size: 15px;">Bekor qilish</button>
        </div>
    </div>

    <!-- Leaflet JS Kutubxonasi -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let selectedTariffName = "Ekonom";
        let selectedTariffPrice = 10000;

        // Xaritani ishga tushirish (Nukus shahri markazi)
        let map = L.map('map').setView([42.4619, 59.6166], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© My Taxi VIP'
        }).addTo(map);

        let marker = L.marker([42.4619, 59.6166]).addTo(map)
            .bindPopup('Tanlangan manzil')
            .openPopup();

        // Manzilni qidirib xaritada ko'rsatish funksiyasi
        function searchLocation(inputId) {
            let query = document.getElementById(inputId).value;
            if (!query) return;

            let url = `https://nominatim.openstreetmap.org/search?format=json&q=${encodeURIComponent(query + ", Nukus, Uzbekistan")}`;

            fetch(url)
                .then(response => response.json())
                .then(data => {
                    if (data && data.length > 0) {
                        let lat = data[0].lat;
                        let lon = data[0].lon;
                        let displayName = data[0].display_name;

                        map.setView([lat, lon], 16);
                        marker.setLatLng([lat, lon]);
                        marker.bindPopup(displayName).openPopup();
                        
                        document.getElementById(inputId).value = data[0].name || query;
                    } else {
                        alert("Bunday manzil topilmadi. Boshqatdan yozib ko'ring.");
                    }
                })
                .catch(err => {
                    console.log("Qidirishda xatolik:", err);
                });
        }

        // Xaritada bosgan joyni belgilash
        map.on('click', function(e) {
            marker.setLatLng(e.latlng);
        });

        function selectTariff(name, price) {
            selectedTariffName = name;
            selectedTariffPrice = price;
            let cards = document.querySelectorAll('.tariff-card');
            cards.forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function orderTaxi() {
            let destination = document.getElementById('destination').value;
            if(!destination) {
                alert("Iltimos, borish manzilingizni kiriting!");
                return;
            }

            document.getElementById('searchModal').style.display = 'flex';
            document.getElementById('modalTitleinnerText').innerText = "Haydovchi qidirilmoqda...";
            document.getElementById('modalTitle').innerText = "Haydovchi qidirilmoqda...";
            document.getElementById('modalSpinner').style.display = 'block';
            document.getElementById('modalText').innerText = "Tarif: " + selectedTariffName + " (" + selectedTariffPrice.toLocaleString() + " so'm)\nKuting...";
            document.getElementById('cancelBtn').style.display = 'block';
            document.getElementById('cancelBtn').style.background = "#eee";
            document.getElementById('cancelBtn').style.color = "#333";
            document.getElementById('cancelBtn').innerText = "Bekor qilish";

            // 3.5 sekunddan keyin haydovchi topilgani haqida xabar chiqadi
            setTimeout(function() {
                document.getElementById('modalSpinner').style.display = 'none';
                document.getElementById('modalTitle').innerText = "Haydovchi topildi! 🎉";
                document.getElementById('modalText').innerHTML = "<b>Haydovchi:</b> Timur aka<br><b>Mashina:</b> Gentra (Oq)<br><b>Raqam:</b> 01 Z 777 ZZ<br><br>Haydovchi siz tomonga harakatlanmoqda.";
                document.getElementById('cancelBtn').innerText = "Yopish";
                document.getElementById('cancelBtn').style.background = "#800020";
                document.getElementById('cancelBtn').style.color = "#fff";
            }, 3500);
        }

        function closeModal() {
            document.getElementById('searchModal').style.display = 'none';
        }
    </script>

</body>
</html>

<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tez Taxi - VIP</title>
    <!-- Leaflet Xarita CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        header {
            background-color: #800020; /* Bardoviy rang */
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        .panel {
            background: #ffffff;
            padding: 20px;
            border-top-left-radius: 24px;
            border-top-right-radius: 24px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.08);
            z-index: 1000;
        }
        .input-group {
            margin-bottom: 12px;
            position: relative;
        }
        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 10px;
            font-size: 15px;
            outline: none;
            background: #fff;
        }
        .input-group input:focus {
            border-color: #800020;
        }
        .search-hint {
            font-size: 11px;
            color: #888;
            margin-top: 3px;
        }
        .tariffs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tariff-card {
            flex: 1;
            border: 2px solid #ddd;
            padding: 10px;
            border-radius: 10px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }
        .tariff-card.active {
            border-color: #800020;
            background-color: #fdf2f4;
        }

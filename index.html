<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tez Taxi - VIP</title>
    <!-- Leaflet Xarita CSS kutubxonasi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f9f9f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #800020; /* Bardoviy rang */
            color: #fff;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 1000;
        }
        /* Xarita ekranni egallashi uchun */
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        .panel {
            background: white;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.08);
            z-index: 1000;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #800020;
        }
        .tariffs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tariff-card {
            flex: 1;
            border: 2px solid #ddd;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
            background: #fff;
        }
        .tariff-card.active {
            border-color: #800020;
            background-color: #fdf2f4;
        }
        .tariff-card h4 {
            font-size: 15px;
            margin-bottom: 5px;
            color: #800020;
        }
        .tariff-card p {
            font-size: 13px;
            color: #555;
        }
        .btn {
            width: 100%;
            background-color: #800020;
            color: #fff;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #5c0015;
        }
        /* Haydovchi qidirish oyna (Modal) dizayni */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.5);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }
        .modal-content {
            background: white;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        .spinner {
            border: 4px solid #f3f3f3;
            border-top: 4px solid #800020;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>🚗 Tez Taxi VIP</header>

    <!-- Haqiqiy xarita chiqadigan joy -->
    <div id="map"></div>

    <div class="panel">
        <div class="input-group">
            <label>Qayerdan (Ketish nuqtasi)</label>
            <input type="text" id="pickup" value="Joriy turgan joyim (GPS)">
        </div>
        <div class="input-group">
            <label>Qayerga (Borish manzili)</label>
            <input type="text" id="destination" placeholder="Masalan: Bozor yoki Universitet">
        </div>

        <label style="font-size: 13px; color: #666; margin-bottom: 5px; display: block;">Tarifni tanlang:</label>
        <div class="tariffs">
            <div class="tariff-card active" onclick="selectTariff('Ekonom', 10000)">
                <h4>Ekonom</h4>
                <p>10,000 so'm</p>
            </div>
            <div class="tariff-card" onclick="selectTariff('Komfort', 18000)">
                <h4>Komfort</h4>
                <p>18,000 so'm</p>
            </div>
        </div>

        <button class="btn" onclick="orderTaxi()">Mashina chaqirish</button>
    </div>

    <!-- Haydovchi qidirish ekrani (Modal) -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: #800020;">Haydovchi qidirilmoqda...</h3>
            <div class="spinner" id="modalSpinner"></div>
            <p id="modalText" style="font-size: 14px; color: #666; margin-top: 10px;">Atrofdagi bo'sh haydovchilarga so'rov yuborilmoqda.</p>
            <button class="btn" id="cancelBtn" onclick="closeModal()" style="margin-top: 15px; background: #ddd; color: #333;">Bekor qilish</button>
        </div>
    </div>

    <!-- Leaflet JS kutubxonasi -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let selectedTariffName = "Ekonom";
        let selectedTariffPrice = 10000;

        // Xaritani ishga tushirish (Boshlang'ich nuqta: Toshkent/O'zbekiston markazi yoki GPS)
        let map = L.map('map').setView([41.3111, 69.2401], 14);

        // Ochiq va bepul xarita qatlamini ulash
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19,
            attribution: '© Tez Taxi'
        }).addTo(map);

        let marker = L.marker([41.3111, 69.2401]).addTo(map)
            .bindPopup('Siz shu yerdasiz')
            .openPopup();

        // Foydalanuvchining haqiqiy GPS joylashuvini olish
        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                
                map.setView([lat, lon], 15);
                marker.setLatLng([lat, lon]);
                document.getElementById('pickup').value = "Mening joylashuvisim (GPS)";
            }, function(error) {
                console.log("GPS aniqlanmadi, standart nuqta qoldi.");
            });
        }

        function selectTariff(name, price) {
            selectedTariffName = name;
            selectedTariffPrice = price;
            let cards = document.querySelectorAll('.tariff-card');
            cards.forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function orderTaxi() {
            let destination = document.getElementById('destination').value;
            if(!destination) {
                alert("Iltimos, borish manzilingizni kiriting!");
                return;
            }

            document.getElementById('searchModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = "Haydovchi qidirilmoqda...";
            document.getElementById('modalSpinner').style.display = 'block';
            document.getElementById('modalText').innerText = "Tarif: " + selectedTariffName + " (" + selectedTariffPrice.toLocaleString() + " so'm)\nKuting...";
            document.getElementById('cancelBtn').style.display = 'block';
            document.getElementById('cancelBtn').style.background = "#ddd";
            document.getElementById('cancelBtn').style.color = "#333";

            setTimeout(function() {
                document.getElementById('modalSpinner').style.display = 'none';
                document.getElementById('modalTitle').innerText = "Haydovchi topildi! 🎉";
                document.getElementById('modalText').innerHTML = "<b>Haydovchi:</b> Anvar aka<br><b>Mashina:</b> Nexia 3 (Oq)<br><b>Raqam:</b> 01 A 777 BA<br><br>Haydovchi yo'lga chiqdi!";
                document.getElementById('cancelBtn').innerText = "Yopish";
                document.getElementById('cancelBtn').style.background = "#800020";
                document.getElementById('cancelBtn').style.color = "#fff";
            }, 3500);
        }

        function closeModal() {
            document.getElementById('searchModal').style.display = 'none';
        }
    </script>

</body>
</html>

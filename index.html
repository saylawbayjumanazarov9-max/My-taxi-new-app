<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Taxi - VIP</title>
    <!-- Leaflet CSS -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
        }
        #map {
            width: 100%;
            height: 60vh;
        }
        .panel {
            position: fixed;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 40vh;
            background: #ffffff;
            padding: 15px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
            overflow-y: auto;
            z-index: 1000;
        }
        .input-group {
            margin-bottom: 10px;
        }
        .input-group input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
            outline: none;
        }
        .btn {
            width: 100%;
            background-color: #800020;
            color: #fff;
            padding: 12px;
            border: none;
            border-radius: 8px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 5px;
        }
    </style>
</head>
<body>

    <!-- Xarita -->
    <div id="map"></div>

    <!-- Panel -->
    <div class="panel">
        <h3 style="color: #800020; margin-bottom: 10px;">🚗 My Taxi VIP</h3>
        <div class="input-group">
            <input type="text" id="pickup" placeholder="Qayerdan (Manzil)">
        </div>
        <div class="input-group">
            <input type="text" id="destination" placeholder="Qayerga (Borish manzili)">
        </div>
        <button class="btn" onclick="alert('Buyurtma qabul qilindi!')">Mashina chaqirish</button>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Xaritani ochish (Nukus shahri)
        var map = L.map('map').setView([42.4619, 59.6166], 14);

        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            maxZoom: 19
        }).addTo(map);

        L.marker([42.4619, 59.6166]).addTo(map)
            .bindPopup('Sizning joylashuvingiz')
            .openPopup();
    </script>

</body>
</html>

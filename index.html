<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tez Taxi</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #f4f4f9;
            color: #333;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #ffcc00;
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
        }
        .map-container {
            flex: 1;
            background-color: #e5e3df;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
        }
        .fake-map {
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #e0f7fa 25%, #80deea 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: #00796b;
            text-align: center;
            padding: 20px;
        }
        .panel {
            background: white;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 10px rgba(0,0,0,0.1);
        }
        .input-group {
            margin-bottom: 15px;
        }
        .input-group label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            color: #666;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 16px;
        }
        .btn {
            width: 100%;
            background-color: #ffcc00;
            color: #000;
            padding: 15px;
            border: none;
            border-radius: 8px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #e6b800;
        }
    </style>
</head>
<body>

    <header>🚗 Tez Taxi</header>

    <div class="map-container">
        <div class="fake-map" id="mapStatus">
            GPS orqali joylashuvingiz aniqlanmoqda...
        </div>
    </div>

    <div class="panel">
        <div class="input-group">
            <label>Qayerdan (Ketish nuqtasi)</label>
            <input type="text" id="pickup" placeholder="Hozirgi turgan joyingiz">
        </div>
        <div class="input-group">
            <label>Qayerga (Borish manzili)</label>
            <input type="text" id="destination" placeholder="Manzilni kiriting">
        </div>
        <button class="btn" onclick="orderTaxi()">Mashina chaqirish</button>
    </div>

    <script>
        // Oddiy geolokatsiyani simulyatsiya qilish yoki aniqlash
        window.onload = function() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(function(position) {
                    document.getElementById('mapStatus').innerText = 
                        "Joylashuv topildi! \nKenglik: " + position.coords.latitude.toFixed(4) + 
                        "\nUzunlik: " + position.coords.longitude.toFixed(4);
                    document.getElementById('pickup').value = "Joriy turgan joyim (GPS)";
                }, function(error) {
                    document.getElementById('mapStatus').innerText = "Manzilni qo'lda kiriting (GPS o'chiq)";
                });
            }
        };

        function orderTaxi() {
            let pickup = document.getElementById('pickup').value;
            let destination = document.getElementById('destination').value;

            if(!destination) {
                alert("Iltimos, borish manzilingizni kiriting!");
                return;
            }

            alert("Buyurtma qabul qilindi! Haydovchi qidirilmoqda...\nYo'nalish: " + pickup + " ➔ " + destination);
        }
    </script>

</body>
</html>

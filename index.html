<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tez Taxi - Yandex Go Style</title>
    <!-- Leaflet Xarita CSS kutubxonasi -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: Arial, sans-serif;
        }
        body {
            background-color: #121212;
            color: #fff;
            display: flex;
            flex-direction: column;
            height: 100vh;
        }
        header {
            background-color: #1e1e1e;
            color: #ffcc00; /* Yandex sarig'i */
            padding: 15px;
            text-align: center;
            font-size: 20px;
            font-weight: bold;
            box-shadow: 0 2px 5px rgba(0,0,0,0.3);
            z-index: 1000;
        }
        /* Xarita ekranni egallashi uchun */
        #map {
            flex: 1;
            width: 100%;
            z-index: 1;
        }
        .panel {
            background: #1e1e1e;
            color: #fff;
            padding: 20px;
            border-top-left-radius: 20px;
            border-top-right-radius: 20px;
            box-shadow: 0 -4px 15px rgba(0,0,0,0.5);
            z-index: 1000;
        }
        .input-group {
            margin-bottom: 12px;
        }
        .input-group label {
            display: block;
            margin-bottom: 4px;
            font-size: 13px;
            color: #aaa;
        }
        .input-group input {
            width: 100%;
            padding: 12px;
            border: 1px solid #333;
            background: #2a2a2a;
            color: #fff;
            border-radius: 8px;
            font-size: 15px;
            outline: none;
        }
        .input-group input:focus {
            border-color: #ffcc00;
        }
        .tariffs {
            display: flex;
            gap: 10px;
            margin-bottom: 15px;
        }
        .tariff-card {
            flex: 1;
            border: 2px solid #333;
            background: #2a2a2a;
            padding: 10px;
            border-radius: 8px;
            text-align: center;
            cursor: pointer;
            transition: 0.2s;
        }
        .tariff-card.active {
            border-color: #ffcc00;
            background-color: #332f10;
        }
        .tariff-card h4 {
            font-size: 15px;
            margin-bottom: 5px;
            color: #ffcc00;
        }
        .tariff-card p {
            font-size: 13px;
            color: #ccc;
        }
        .btn {
            width: 100%;
            background-color: #ffcc00; /* Yandex sariq tugmasi */
            color: #000;
            padding: 14px;
            border: none;
            border-radius: 8px;
            font-size: 17px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn:active {
            background-color: #e6b800;
        }
        /* Haydovchi qidirish oyna (Modal) dizayni */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            align-items: center;
            justify-content: center;
            padding: 20px;
            z-index: 2000;
        }
        .modal-content {
            background: #2a2a2a;
            color: #fff;
            padding: 25px;
            border-radius: 12px;
            text-align: center;
            width: 100%;
            max-width: 320px;
        }
        .spinner {
            border: 4px solid #444;
            border-top: 4px solid #ffcc00;
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 15px auto;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body>

    <header>🚖 Yandex Go Style</header>

    <!-- Xarita -->
    <div id="map"></div>

    <div class="panel">
        <div class="input-group">
            <label>Qayerdan</label>
            <input type="text" id="pickup" value="Joriy turgan joyim (GPS)">
        </div>
        <div class="input-group">
            <label>Qayerga</label>
            <input type="text" id="destination" placeholder="Manzilni kiriting...">
        </div>

        <label style="font-size: 13px; color: #aaa; margin-bottom: 5px; display: block;">Tarifni tanlang:</label>
        <div class="tariffs">
            <div class="tariff-card active" onclick="selectTariff('Start / Ekonom', 10000)">
                <h4>Ekonom</h4>
                <p>10,000 so'm</p>
            </div>
            <div class="tariff-card" onclick="selectTariff('Komfort+', 18000)">
                <h4>Komfort</h4>
                <p>18,000 so'm</p>
            </div>
        </div>

        <button class="btn" onclick="orderTaxi()">Tarifni tanlash va chaqirish</button>
    </div>

    <!-- Modal -->
    <div class="modal" id="searchModal">
        <div class="modal-content">
            <h3 id="modalTitle" style="color: #ffcc00;">Haydovchi qidirilmoqda...</h3>
            <div class="spinner" id="modalSpinner"></div>
            <p id="modalText" style="font-size: 14px; color: #ccc; margin-top: 10px;">Yaqin atrofdagi mashinalar ko'rib chiqilmoqda.</p>
            <button class="btn" id="cancelBtn" onclick="closeModal()" style="margin-top: 15px; background: #444; color: #fff;">Bekor qilish</button>
        </div>
    </div>

    <!-- Leaflet JS -->
    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        let selectedTariffName = "Ekonom";
        let selectedTariffPrice = 10000;

        // Xaritani yaratish (Toshkent / O'zbekiston bo'yicha)
        let map = L.map('map', {zoomControl: false}).setView([41.3111, 69.2401], 15);

        // Yandex Go ga o'xshash qorong'u (Dark) xarita dizayni
        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', {
            maxZoom: 19,
            attribution: '© Yandex Go Style'
        }).addTo(map);

        let marker = L.marker([41.3111, 69.2401]).addTo(map);

        if (navigator.geolocation) {
            navigator.geolocation.getCurrentPosition(function(position) {
                let lat = position.coords.latitude;
                let lon = position.coords.longitude;
                map.setView([lat, lon], 16);
                marker.setLatLng([lat, lon]);
            });
        }

        function selectTariff(name, price) {
            selectedTariffName = name;
            selectedTariffPrice = price;
            let cards = document.querySelectorAll('.tariff-card');
            cards.forEach(card => card.classList.remove('active'));
            event.currentTarget.classList.add('active');
        }

        function orderTaxi() {
            let destination = document.getElementById('destination').value;
            if(!destination) {
                alert("Iltimos, borish manzilingizni kiriting!");
                return;
            }

            document.getElementById('searchModal').style.display = 'flex';
            document.getElementById('modalTitle').innerText = "Mashina qidirilmoqda...";
            document.getElementById('modalSpinner').style.display = 'block';
            document.getElementById('modalText').innerText = selectedTariffName + " - " + selectedTariffPrice.toLocaleString() + " so'm\nHaydovchiga buyurtma berilyapti...";
            document.getElementById('cancelBtn').style.display = 'block';
            document.getElementById('cancelBtn').style.background = "#444";
            document.getElementById('cancelBtn').style.color = "#fff";

            setTimeout(function() {
                document.getElementById('modalSpinner').style.display = 'none';
                document.getElementById('modalTitle').innerText = "Haydovchi topildi! 🚖";
                document.getElementById('modalText').innerHTML = "<b>Haydovchi:</b> Jasur<br><b>Mashina:</b> Gentra (Qora)<br><b>Raqam:</b> 01 Z 999 ZZ<br><br>Haydovchi kutish joyiga bormoqda.";
                document.getElementById('cancelBtn').innerText = "Yopish";
                document.getElementById('cancelBtn').style.background = "#ffcc00";
                document.getElementById('cancelBtn').style.color = "#000";
            }, 3500);
        }

        function closeModal() {
            document.getElementById('searchModal').style.display = 'none';
        }
    </script>

</body>
</html>
